# A dedicated instance: this program and its own Postgres, started with one command.
#
#   docker compose up -d --build
#
# Compose builds the app image only when there is none, so after pulling new code run
# it with --build again (quick when nothing changed). Without --build you keep running
# the image you built first.
#
# One-time: echo "DB_PASSWORD=$(openssl rand -hex 24)" > .env
#
# The first start makes the keys and the control database and keeps them in the
# `instance` volume; later starts reuse them. Back that volume up with the database:
# without the keys the data cannot be read.
#
# To try it on one machine without an identity provider:
#   NODE_ENV=development AUTH_DEV=1 docker compose up --build
# For real use set APP_ORIGIN (https), OIDC_ISSUER, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET,
# OPERATOR_EMAILS, and MIGRATION_TOKEN if workspaces will be sent here from another instance.
name: alimentation

services:
  db:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD (any long random string; it never leaves this machine)}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 20
    # Not published: only the app reaches it.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${PORT:-8787}:8787'
    volumes:
      - instance:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- "http://127.0.0.1:$$PORT/api/health" >/dev/null || exit 1']
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 4
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8787}
      DEDICATED: '1'
      PLACEMENT_ADMIN_URL: postgres://postgres:${DB_PASSWORD}@db:5432/postgres
      AUTH_DEV: ${AUTH_DEV:-0}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_EMAIL_VERIFIED_CLAIM: ${OIDC_EMAIL_VERIFIED_CLAIM:-}
      OPERATOR_EMAILS: ${OPERATOR_EMAILS:-}
      MIGRATION_TOKEN: ${MIGRATION_TOKEN:-}

  # The API reference is a site of its own, on its own port, built from the same code as the server.
  # It is not started unless asked for:
  #   docker compose --profile reference up -d --build reference     then  http://localhost:8788
  reference:
    profiles: ['reference']
    build:
      context: .
      target: reference
    restart: unless-stopped
    ports:
      - '${REFERENCE_PORT:-8788}:8788'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- "http://127.0.0.1:8788/healthz" >/dev/null || exit 1']
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 4

volumes:
  pgdata:
  instance:
