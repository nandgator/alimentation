name: ci

on:
  push:
    branches: [build, main]
  pull_request:

permissions:
  contents: read

jobs:
  # Format, types and every test, in the same containers anyone can run locally:
  #   docker compose -f compose.test.yaml run --rm test
  # The Postgres log check is required here, not skipped.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - run: docker compose -f compose.test.yaml run --rm --build test
      - if: always()
        run: docker compose -f compose.test.yaml down -v

  # The image that ships starts, sets itself up against a fresh Postgres, and serves.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: scripts/smoke-compose.sh

  # The Cloudflare Worker, bundled as it would be deployed and then run in the Workers
  # runtime against Postgres through the same kind of WebSocket path Neon uses.
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter @alimentation/api build:worker
      - run: scripts/smoke-worker.sh

  # The API reference is a site of its own: built from the server's routes, with Scalar, and served
  # with nothing fetched from outside it.
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:reference
      - run: |
          PORT=18788 node apps/reference/serve.mjs &
          for _ in $(seq 1 20); do curl -fsS localhost:18788/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS localhost:18788/openapi.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const n=Object.keys(JSON.parse(s).paths).length;if(n<40){console.error("only "+n+" paths");process.exit(1)}})'
          curl -fsS -o /dev/null localhost:18788/scalar/standalone.js

  # The real app in a real browser, desktop and phone: a kitchen from its first day to its last,
  # with accessibility and layout checks at every stage.
  # It runs in three pieces at once, each with its own Postgres and its own copy of the app, so a
  # run takes the time of the longest piece. A piece that fails does not stop the others.
  e2e:
    name: e2e (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s
          --health-retries 20
    env:
      ALIMENTATION_TEST_PG: postgres://postgres:ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run --filter @alimentation/api build:server && bun run build:web
      - run: bunx playwright test --shard=${{ matrix.shard }}
        working-directory: apps/web
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-results-${{ strategy.job-index }}
          path: apps/web/test-results
          retention-days: 7
